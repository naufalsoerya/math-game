# Start:  docker compose up -d --build
# Logs:   docker compose logs -f
# Stop:   docker compose down
name: mathfarm
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mathgame_prod_user
      POSTGRES_PASSWORD: Althessa2024
      POSTGRES_DB: mathgame_prod_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathgame_prod_user -d mathgame_prod_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  mathfarm:
    build: .
    image: adley-math-farm:2.2.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Host must be "db" (Docker service name), not localhost.
      DATABASE_URL: postgresql://mathgame_prod_user:Althessa2024@db:5432/mathgame_prod_db
      HOST: 0.0.0.0
      SITE_DIR: /app/site
    env_file: server/.env
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  pgdata:
